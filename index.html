<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cricket Field Diagram Planner</title>
  <style>
    :root {
      --bg: #1e1e24;
      --panel: #2b2b36;
      --accent: #2e7d32;
      --text: #f0f0f5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    #sidebar {
      width: 300px;
      min-width: 300px;
      background: var(--panel);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 2px 0 10px rgba(0,0,0,0.3);
      overflow-y: auto;
      z-index: 10;
    }
    #roster-sidebar {
      width: 270px;
      min-width: 270px;
      background: var(--panel);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: -2px 0 10px rgba(0,0,0,0.3);
      overflow-y: auto;
      z-index: 10;
    }
    h2 { font-size: 1rem; color: #a5d6a7; text-transform: uppercase; letter-spacing: 0.5px; }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    label { font-size: 0.8rem; opacity: 0.85; font-weight: 500; }
    select, input[type="text"] {
      background: #1e1e24;
      border: 1px solid #555;
      padding: 6px 8px;
      border-radius: 4px;
      color: white;
      font-size: 0.85rem;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 0.8rem;
      user-select: none;
    }
    .toggle-row input[type="checkbox"] {
      width: 15px;
      height: 15px;
      accent-color: #2e7d32;
      cursor: pointer;
    }
    .tool-btn {
      background: #3b3b4a;
      border: 2px solid transparent;
      color: white;
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.82rem;
      text-align: left;
      transition: all 0.2s;
    }
    .tool-btn:hover { background: #4a4a5c; }
    .tool-btn.active {
      border-color: #81c784;
      background: #2e5339;
      font-weight: bold;
    }
    .action-btn {
      background: #388e3c;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.88rem;
    }
    .action-btn:hover { background: #2e7d32; }
    .secondary-btn {
      background: #d32f2f;
      color: white;
      border: none;
      padding: 6px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .secondary-btn:hover { background: #b71c1c; }
    .scenario-row {
      display: flex;
      gap: 6px;
    }
    .scenario-row select {
      flex: 1;
    }
    .small-btn {
      background: #444;
      border: 1px solid #666;
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.78rem;
    }
    .small-btn:hover { background: #555; }

    /* Roster Styling */
    .roster-card {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #202029;
      padding: 5px 8px;
      border-radius: 6px;
      border: 1px solid #3c3c4d;
      transition: border-color 0.15s;
    }
    .roster-card.active-player {
      border-color: #81c784;
      background: #29302b;
    }
    .roster-num {
      font-size: 0.75rem;
      font-weight: bold;
      color: #9e9ea7;
      width: 16px;
    }
    .roster-input {
      flex: 1;
      background: transparent;
      border: none;
      color: white;
      font-size: 0.82rem;
      font-weight: 500;
      padding: 2px 4px;
    }
    .roster-input:focus {
      outline: none;
      border-bottom: 1px solid #81c784;
    }
    .roster-color-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid #ffffff44;
      flex-shrink: 0;
    }
    .roster-color-input {
      opacity: 0;
      position: absolute;
      pointer-events: none;
      width: 0;
      height: 0;
    }
    .on-field-badge {
      font-size: 0.68rem;
      padding: 2px 4px;
      border-radius: 3px;
      background: #2e7d32;
      color: white;
    }

    /* Feedback & Modals */
    .feedback-link-btn {
      background: transparent;
      border: 1px solid #555;
      color: #bbb;
      padding: 6px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.78rem;
      text-align: center;
      transition: all 0.2s;
    }
    .feedback-link-btn:hover {
      background: #3b3b4a;
      color: white;
      border-color: #888;
    }
    #feedback-modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .feedback-card {
      background: var(--panel);
      padding: 22px;
      border-radius: 8px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .feedback-card textarea {
      background: #1e1e24;
      border: 1px solid #555;
      padding: 8px;
      border-radius: 4px;
      color: white;
      resize: vertical;
      min-height: 80px;
      font-family: inherit;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 6px;
    }

    #canvas-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 14px;
      position: relative;
    }
    canvas {
      background: #438945;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      cursor: crosshair;
    }
  </style>
</head>
<body>

<!-- Left Control Sidebar -->
<div id="sidebar">
  <h2>Tactics Builder</h2>

  <div class="control-group">
    <label>Diagram Title</label>
    <input type="text" id="diagTitle" value="Standard Field Plan" oninput="drawCanvas()">
  </div>

  <div class="control-group">
    <label>Striker Facing</label>
    <select id="batterHand" onchange="drawCanvas()">
      <option value="RHB">Right-Hand Batter (RHB)</option>
      <option value="LHB">Left-Hand Batter (LHB)</option>
    </select>
  </div>

  <div class="control-group">
    <label>Batting End</label>
    <select id="strikerEnd" onchange="drawCanvas()">
      <option value="top">North End (Top)</option>
      <option value="bottom">South End (Bottom)</option>
    </select>
  </div>

  <div class="control-group">
    <label class="toggle-row">
      <input type="checkbox" id="togglePosLabels" checked onchange="drawCanvas()">
      <span>Show Position Text</span>
    </label>
    <label class="toggle-row">
      <input type="checkbox" id="toggleExclusion" checked onchange="drawCanvas()">
      <span>Show 10m Safety Arc</span>
    </label>
  </div>

  <div class="control-group">
    <label>Custom Scenarios</label>
    <div class="scenario-row">
      <select id="scenarioSelect" onchange="loadScenario()">
        <option value="">-- Load Saved Scenario --</option>
      </select>
      <button class="small-btn" onclick="saveCurrentScenario()" title="Save current field">💾 Save</button>
      <button class="small-btn" onclick="deleteCurrentScenario()" title="Delete scenario">🗑</button>
    </div>
  </div>

  <div class="control-group">
    <label>Tool Mode</label>
    <button class="tool-btn active" id="btn-dot" onclick="setMode('dot')">● Add / Move Player</button>
    <button class="tool-btn" id="btn-arrow" onclick="setMode('arrow')">➔ Draw Move Arrow</button>
    <button class="tool-btn" id="btn-label" onclick="setMode('label')">T Add Tactical Text</button>
    <button class="tool-btn" id="btn-delete" onclick="setMode('delete')">✖ Remove Item</button>
  </div>

  <div class="control-group" id="label-text-group" style="display:none;">
    <label>Tactical Note Text</label>
    <input type="text" id="labelText" placeholder="e.g. SLIP CATCHING">
  </div>

  <div class="control-group">
    <button class="tool-btn" onclick="undo()">↶ Undo Step</button>
    <button class="secondary-btn" onclick="clearField()">Clear Field Marks</button>
  </div>

  <div class="control-group" style="margin-top: auto;">
    <button class="action-btn" onclick="exportImage()">⬇ Export PNG Image</button>
    <button class="feedback-link-btn" onclick="openFeedbackModal()">💬 Send Feedback</button>
  </div>
</div>

<!-- Center Field Canvas -->
<div id="canvas-container">
  <canvas id="groundCanvas" width="800" height="920"></canvas>
</div>

<!-- Right Roster & Team Sheet Sidebar -->
<div id="roster-sidebar">
  <div style="display: flex; justify-content: space-between; align-items: center;">
    <h2>Team Roster (11)</h2>
    <span style="font-size: 0.72rem; opacity: 0.65;">Click dot to recolor</span>
  </div>
  <div id="roster-list" style="display: flex; flex-direction: column; gap: 6px; overflow-y: auto;">
    <!-- Rendered dynamically by JS -->
  </div>
</div>

<!-- Feedback Modal -->
<div id="feedback-modal-overlay">
  <div class="feedback-card">
    <h3 style="color: #a5d6a7; font-size: 1rem;">Feedback & Suggestions</h3>
    <p style="font-size: 0.8rem; opacity: 0.8;">Spot a bug, missing field position, or have a feature idea?</p>
    
    <form id="feedbackForm" action="https://formspree.io/f/xgaapdgw" method="POST">
      <div class="control-group" style="margin-bottom: 6px;">
        <label>Your Name / Role (optional)</label>
        <input type="text" name="name" placeholder="e.g. Coach Tim / U13s">
      </div>
      <div class="control-group" style="margin-bottom: 6px;">
        <label>Feedback</label>
        <textarea name="message" required placeholder="What would make this tool better?"></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="tool-btn" onclick="closeFeedbackModal()">Cancel</button>
        <button type="submit" class="action-btn" style="padding: 6px 14px;">Send</button>
      </div>
    </form>
  </div>
</div>

<script>
  const canvas = document.getElementById('groundCanvas');
  const ctx = canvas.getContext('2d');

  let currentMode = 'dot';
  let arrowStart = null;
  let elements = [];

  // Team Roster (11 Players with distinct default colours)
  const DEFAULT_COLORS = [
    '#ffffff', '#ffd600', '#ff6d00', '#ff1744', 
    '#f06292', '#ab47bc', '#00e676', '#00b0ff', 
    '#1565c0', '#00e5ff', '#a1887f'
  ];

  let roster = Array.from({ length: 11 }, (_, i) => ({
    id: i + 1,
    name: `Player ${i + 1}`,
    color: DEFAULT_COLORS[i]
  }));

  let activePlayerIndex = 0;

  let isDragging = false;
  let draggedDot = null;
  let dragMoved = false;

  const CX = 400;
  const CY = 475;
  const PITCH_H = 150;
  const EXCLUSION_RADIUS_PX = 74;

  function renderRoster() {
    const list = document.getElementById('roster-list');
    list.innerHTML = '';

    roster.forEach((p, idx) => {
      const isOnField = elements.some(el => el.type === 'dot' && el.playerId === p.id);

      const card = document.createElement('div');
      card.className = `roster-card ${idx === activePlayerIndex ? 'active-player' : ''}`;
      card.onclick = (e) => {
        if (e.target.tagName !== 'INPUT') {
          activePlayerIndex = idx;
          renderRoster();
          drawCanvas();
        }
      };

      const num = document.createElement('span');
      num.className = 'roster-num';
      num.textContent = `${p.id}.`;

      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'roster-input';
      input.value = p.name;
      input.oninput = (e) => {
        p.name = e.target.value.trim() || `Player ${p.id}`;
        // Update existing dot labels
        elements.forEach(el => {
          if (el.type === 'dot' && el.playerId === p.id) {
            el.playerName = p.name;
          }
        });
        drawCanvas();
      };

      // Hidden native color picker triggered by clicking swatch
      const colorInput = document.createElement('input');
      colorInput.type = 'color';
      colorInput.className = 'roster-color-input';
      colorInput.value = p.color;
      colorInput.onchange = (e) => {
        p.color = e.target.value;
        // Update dot color
        elements.forEach(el => {
          if (el.type === 'dot' && el.playerId === p.id) {
            el.color = p.color;
          }
        });
        renderRoster();
        drawCanvas();
      };

      const swatch = document.createElement('div');
      swatch.className = 'roster-color-dot';
      swatch.style.background = p.color;
      swatch.title = "Change player color";
      swatch.onclick = (e) => {
        e.stopPropagation();
        colorInput.click();
      };

      card.appendChild(num);
      card.appendChild(swatch);
      card.appendChild(input);
      card.appendChild(colorInput);

      if (isOnField) {
        const badge = document.createElement('span');
        badge.className = 'on-field-badge';
        badge.textContent = 'ON';
        card.appendChild(badge);
      }

      list.appendChild(card);
    });
  }

  function getStrikerCoords() {
    const isBottom = document.getElementById('strikerEnd').value === 'bottom';
    return {
      x: CX,
      y: isBottom ? (CY + PITCH_H / 2 - 20) : (CY - PITCH_H / 2 + 20),
      isBottom: isBottom
    };
  }

  function setMode(mode) {
    currentMode = mode;
    arrowStart = null;
    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
    const activeBtn = document.getElementById(`btn-${mode}`);
    if (activeBtn) activeBtn.classList.add('active');
    document.getElementById('label-text-group').style.display = (mode === 'label') ? 'flex' : 'none';
    canvas.style.cursor = (mode === 'dot') ? 'default' : 'crosshair';
    drawCanvas();
  }

  function classifyFielder(x, y) {
    const striker = getStrikerCoords();
    const isLHB = document.getElementById('batterHand').value === 'LHB';
    
    let dx = x - striker.x;
    let dy = y - striker.y;

    if (striker.isBottom) {
      dy = -dy;
      dx = -dx;
    }
    if (isLHB) dx = -dx;

    const distFromStriker = Math.hypot(dx, dy);

    const isKeeper = (distFromStriker < 85 && dy < 0 && Math.abs(dx) < 24);
    const isSlipsGully = (!isKeeper && dy < 15 && dx < -15 && dx > -120 && distFromStriker < 130);

    const normDistCenter = Math.pow((x - CX) / 180, 2) + Math.pow((y - CY) / 210, 2);
    const isDeep = normDistCenter > 1.0;

    const inFrontOfCrease = dy > 0;
    const isInside10m = inFrontOfCrease && (distFromStriker < EXCLUSION_RADIUS_PX);

    return {
      isKeeper,
      isSlipsGully,
      isDeep,
      isRing: !isDeep && !isKeeper && !isSlipsGully,
      isInside10m: isInside10m && !isKeeper && !isSlipsGully
    };
  }

  function getPositionName(x, y) {
    const striker = getStrikerCoords();
    const isLHB = document.getElementById('batterHand').value === 'LHB';
    
    let dx = x - striker.x;
    let dy = y - striker.y;

    if (striker.isBottom) {
      dy = -dy;
      dx = -dx;
    }
    if (isLHB) dx = -dx;

    const dist = Math.hypot(dx, dy);

    if (dist < 85 && dy < 0 && Math.abs(dx) < 24) return "Wicketkeeper";

    if (dy < 15 && dx < -15 && dx > -120 && dist < 130) {
      if (dx > -42) return "1st Slip";
      if (dx > -75) return "2nd Slip";
      return "Gully";
    }

    let theta = Math.atan2(dx, dy) * (180 / Math.PI);
    const isClose = dist < 90;
    const isDeep = Math.pow((x - CX) / 180, 2) + Math.pow((y - CY) / 210, 2) > 1.0;

    // Off-side
    if (theta < -145) return isDeep ? "Deep Third" : "Fly Slip";
    if (theta >= -145 && theta < -105) return isDeep ? "Deep Bwd Point" : (isClose ? "Backward Point" : "Bwd Point");
    if (theta >= -105 && theta < -70)  return isDeep ? "Deep Point" : "Point";
    if (theta >= -70 && theta < -40)   return isDeep ? "Deep Cover" : (isClose ? "Cover Point" : "Cover");
    if (theta >= -40 && theta < -15)   return isDeep ? "Deep Extra Cover" : "Extra Cover";
    if (theta >= -15 && theta < 0)     return isDeep ? "Long-Off" : (isClose ? "Silly Mid-Off" : "Mid-Off");

    // Leg-side
    if (theta >= 0 && theta < 15)      return isDeep ? "Long-On" : (isClose ? "Silly Mid-On" : "Mid-On");
    if (theta >= 15 && theta < 50)     return isDeep ? "Deep Mid-Wkt" : (isClose ? "Short Mid-Wkt" : "Mid-Wicket");
    if (theta >= 50 && theta < 80)     return isDeep ? "Cow Corner" : "Mid-Wicket";
    if (theta >= 80 && theta < 115)    return isDeep ? "Deep Sq Leg" : (isClose ? "Short Leg" : "Square Leg");
    if (theta >= 115 && theta < 155)   return isDeep ? "Deep Bwd Sq" : "Bwd Square Leg";
    return isDeep ? "Deep Fine Leg" : (isClose ? "Leg Slip" : "Fine Leg");
  }

  function drawFieldBase() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#f4ebd9";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const title = document.getElementById('diagTitle').value;
    ctx.fillStyle = "#111";
    ctx.font = "bold 20px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(title.toUpperCase(), canvas.width / 2, 38);

    // Outfield boundary
    ctx.beginPath();
    ctx.ellipse(CX, CY, 340, 400, 0, 0, Math.PI * 2);
    ctx.fillStyle = "#52945b";
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = "#e8f5e9";
    ctx.stroke();

    // 30-Yard Circle
    ctx.beginPath();
    ctx.ellipse(CX, CY, 180, 210, 0, 0, Math.PI * 2);
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 8]);
    ctx.strokeStyle = "rgba(255, 255, 255, 0.75)";
    ctx.stroke();
    ctx.setLineDash([]);

    // Pitch
    const pitchW = 48;
    ctx.fillStyle = "#d7c19a";
    ctx.fillRect(CX - pitchW / 2, CY - PITCH_H / 2, pitchW, PITCH_H);
    ctx.strokeStyle = "#bfa77c";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(CX - pitchW / 2, CY - PITCH_H / 2, pitchW, PITCH_H);

    // Crease lines
    const topCreaseY = CY - PITCH_H / 2 + 20;
    const botCreaseY = CY + PITCH_H / 2 - 20;
    ctx.strokeStyle = "white";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(CX - pitchW/2, topCreaseY);
    ctx.lineTo(CX + pitchW/2, topCreaseY);
    ctx.moveTo(CX - pitchW/2, botCreaseY);
    ctx.lineTo(CX + pitchW/2, botCreaseY);
    ctx.stroke();

    // Striker Marker & Direction
    const striker = getStrikerCoords();
    const isLHB = document.getElementById('batterHand').value === 'LHB';
    ctx.fillStyle = "#ff1744";
    ctx.font = "bold 11px sans-serif";

    if (!striker.isBottom) {
      ctx.fillText(`BATTER (${isLHB ? 'LHB' : 'RHB'})`, CX, striker.y - 24);
      ctx.beginPath();
      ctx.moveTo(CX, striker.y - 4);
      ctx.lineTo(CX - 5, striker.y - 16);
      ctx.lineTo(CX + 5, striker.y - 16);
      ctx.closePath();
      ctx.fill();
    } else {
      ctx.fillText(`BATTER (${isLHB ? 'LHB' : 'RHB'})`, CX, striker.y + 28);
      ctx.beginPath();
      ctx.moveTo(CX, striker.y + 4);
      ctx.lineTo(CX - 5, striker.y + 16);
      ctx.lineTo(CX + 5, striker.y + 16);
      ctx.closePath();
      ctx.fill();
    }

    // 10m Junior Safety Exclusion Arc
    const showExclusion = document.getElementById('toggleExclusion').checked;
    if (showExclusion) {
      ctx.save();
      ctx.beginPath();
      if (!striker.isBottom) {
        ctx.arc(striker.x, striker.y, EXCLUSION_RADIUS_PX, 0, Math.PI);
      } else {
        ctx.arc(striker.x, striker.y, EXCLUSION_RADIUS_PX, Math.PI, 0);
      }
      ctx.strokeStyle = "rgba(255, 238, 88, 0.65)";
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 5]);
      ctx.stroke();
      
      ctx.fillStyle = "rgba(255, 238, 88, 0.85)";
      ctx.font = "9px sans-serif";
      ctx.textAlign = "center";
      const arcLabelY = !striker.isBottom ? striker.y + EXCLUSION_RADIUS_PX + 12 : striker.y - EXCLUSION_RADIUS_PX - 5;
      ctx.fillText("10m Safety Zone", CX, arcLabelY);
      ctx.restore();
    }
  }

  function drawArrow(x1, y1, x2, y2, color) {
    const headLength = 12;
    const dx = x2 - x1;
    const dy = y2 - y1;
    const angle = Math.atan2(dy, dx);

    ctx.save();
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 3;

    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - headLength * Math.cos(angle - Math.PI / 6), y2 - headLength * Math.sin(angle - Math.PI / 6));
    ctx.lineTo(x2 - headLength * Math.cos(angle + Math.PI / 6), y2 - headLength * Math.sin(angle + Math.PI / 6));
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawPillBadge(deepCount, ringCount, slipsCount, safetyBreach, totalFielders) {
    const combined = deepCount + slipsCount;
    ctx.save();

    const badgeW = 210;
    const badgeH = safetyBreach ? 90 : 72;
    const badgeX = canvas.width - badgeW - 20;
    const badgeY = 16;

    ctx.fillStyle = "rgba(22, 28, 24, 0.88)";
    ctx.strokeStyle = safetyBreach ? "#ff5252" : "#81c784";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(badgeX, badgeY, badgeW, badgeH, 8);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 11px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.textAlign = "left";
    ctx.fillText(`FIELDERS: ${totalFielders} on field`, badgeX + 12, badgeY + 18);

    ctx.font = "11px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.fillStyle = "#cfd8dc";
    ctx.fillText(`Deep: ${deepCount}  |  Ring: ${ringCount}  |  Slips: ${slipsCount}`, badgeX + 12, badgeY + 36);

    ctx.font = "bold 11px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.fillStyle = "#a5d6a7";
    ctx.fillText(`Deep + Slips/Gully: ${combined}`, badgeX + 12, badgeY + 54);

    if (safetyBreach) {
      ctx.fillStyle = "#ff5252";
      ctx.font = "bold 10px -apple-system, BlinkMacSystemFont, sans-serif";
      ctx.fillText(`⚠ Safety: Fielder inside 10m arc!`, badgeX + 12, badgeY + 74);
    }

    ctx.restore();
  }

  function drawCanvas() {
    drawFieldBase();

    const showPosLabels = document.getElementById('togglePosLabels').checked;

    let deepCount = 0;
    let ringCount = 0;
    let slipsCount = 0;
    let safetyBreach = false;
    let dotCount = 0;

    elements.forEach(el => {
      if (el.type === 'dot') {
        dotCount++;
        const info = classifyFielder(el.x, el.y);
        if (info.isDeep) deepCount++;
        if (info.isRing) ringCount++;
        if (info.isSlipsGully) slipsCount++;
        if (info.isInside10m) safetyBreach = true;

        // Player Dot
        ctx.beginPath();
        ctx.arc(el.x, el.y, 9, 0, Math.PI * 2);
        ctx.fillStyle = el.color;
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = info.isInside10m ? '#ff1744' : '#111111';
        ctx.stroke();

        // Selected active player highlight
        const activePlayer = roster[activePlayerIndex];
        if (activePlayer && el.playerId === activePlayer.id) {
          ctx.beginPath();
          ctx.arc(el.x, el.y, 14, 0, Math.PI * 2);
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2;
          ctx.stroke();
        }

        // Fielder Label (Name + Position)
        const posName = getPositionName(el.x, el.y);
        const labelText = showPosLabels ? `${el.playerName || 'Fielder'}: ${posName}` : (el.playerName || '');

        if (labelText) {
          ctx.save();
          ctx.font = "600 9.5px -apple-system, BlinkMacSystemFont, sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";

          const textMetrics = ctx.measureText(labelText);
          const padX = 5;
          const boxW = textMetrics.width + (padX * 2);
          const boxH = 14;
          const tagY = el.y + 17;

          ctx.fillStyle = info.isInside10m ? "rgba(180, 20, 20, 0.9)" : "rgba(18, 24, 20, 0.88)";
          ctx.beginPath();
          ctx.roundRect(el.x - boxW / 2, tagY - boxH / 2, boxW, boxH, 3);
          ctx.fill();

          ctx.fillStyle = "#ffffff";
          ctx.fillText(labelText, el.x, tagY);
          ctx.restore();
        }

      } else if (el.type === 'arrow') {
        drawArrow(el.x1, el.y1, el.x2, el.y2, el.color);
      } else if (el.type === 'label') {
        ctx.save();
        ctx.font = "bold 12px -apple-system, sans-serif";
        ctx.fillStyle = el.color;
        ctx.textAlign = "center";
        ctx.fillText(el.text, el.x, el.y);
        ctx.restore();
      }
    });

    drawPillBadge(deepCount, ringCount, slipsCount, safetyBreach, dotCount);

    if (arrowStart && currentMode === 'arrow') {
      ctx.beginPath();
      ctx.arc(arrowStart.x, arrowStart.y, 5, 0, Math.PI * 2);
      ctx.fillStyle = roster[activePlayerIndex]?.color || '#ffffff';
      ctx.fill();
    }
  }

  // --- MOUSE & DRAG INTERACTION ---
  canvas.addEventListener('mousedown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    if (currentMode === 'dot') {
      const hitDot = elements.slice().reverse().find(el => el.type === 'dot' && Math.hypot(el.x - x, el.y - y) <= 18);
      if (hitDot) {
        isDragging = true;
        draggedDot = hitDot;
        dragMoved = false;
        // Set active player to this dot's player
        const rIdx = roster.findIndex(p => p.id === hitDot.playerId);
        if (rIdx !== -1) {
          activePlayerIndex = rIdx;
          renderRoster();
        }
        canvas.style.cursor = 'grabbing';
      }
    }
  });

  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    if (isDragging && draggedDot) {
      dragMoved = true;
      draggedDot.x = x;
      draggedDot.y = y;
      drawCanvas();
    } else if (currentMode === 'dot') {
      const hoveringDot = elements.some(el => el.type === 'dot' && Math.hypot(el.x - x, el.y - y) <= 14);
      canvas.style.cursor = hoveringDot ? 'grab' : 'crosshair';
    }
  });

  window.addEventListener('mouseup', () => {
    if (isDragging) {
      isDragging = false;
      draggedDot = null;
      canvas.style.cursor = (currentMode === 'dot') ? 'crosshair' : 'default';
      drawCanvas();
    }
  });

  canvas.addEventListener('click', (e) => {
    if (dragMoved) {
      dragMoved = false;
      return;
    }

    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    if (currentMode === 'dot') {
      const hitDot = elements.find(el => el.type === 'dot' && Math.hypot(el.x - x, el.y - y) <= 18);
      if (!hitDot) {
        // Choose active player or next unassigned player
        let p = roster[activePlayerIndex];
        const alreadyOnField = elements.some(el => el.type === 'dot' && el.playerId === p.id);
        if (alreadyOnField) {
          // Find next player not yet placed
          const unassigned = roster.find(candidate => !elements.some(el => el.type === 'dot' && el.playerId === candidate.id));
          if (unassigned) {
            p = unassigned;
            activePlayerIndex = roster.indexOf(p);
          }
        }

        elements.push({
          type: 'dot',
          x,
          y,
          color: p.color,
          playerId: p.id,
          playerName: p.name
        });

        // Advance to next player
        if (activePlayerIndex < 10) {
          activePlayerIndex++;
        }
        renderRoster();
        drawCanvas();
      }
    } else if (currentMode === 'arrow') {
      const playerColor = roster[activePlayerIndex]?.color || '#ffffff';
      if (!arrowStart) {
        arrowStart = { x, y };
        drawCanvas();
      } else {
        elements.push({
          type: 'arrow',
          x1: arrowStart.x,
          y1: arrowStart.y,
          x2: x,
          y2: y,
          color: playerColor
        });
        arrowStart = null;
        drawCanvas();
      }
    } else if (currentMode === 'label') {
      const text = document.getElementById('labelText').value.trim();
      if (text) {
        elements.push({ type: 'label', x, y, text: text, color: '#ffffff' });
        drawCanvas();
      }
    } else if (currentMode === 'delete') {
      const idx = elements.findIndex(el => {
        if (el.type === 'dot' || el.type === 'label') {
          return Math.hypot(el.x - x, el.y - y) < 22;
        } else if (el.type === 'arrow') {
          return Math.hypot(el.x2 - x, el.y2 - y) < 18 || Math.hypot(el.x1 - x, el.y1 - y) < 18;
        }
        return false;
      });
      if (idx !== -1) {
        elements.splice(idx, 1);
        renderRoster();
        drawCanvas();
      }
    }
  });

  function undo() {
    elements.pop();
    arrowStart = null;
    renderRoster();
    drawCanvas();
  }

  function clearField() {
    if (confirm("Reset all field marks?")) {
      elements = [];
      arrowStart = null;
      renderRoster();
      drawCanvas();
    }
  }

  // Export includes the team sheet legend neatly at the bottom
  function exportImage() {
    const exportCanvas = document.createElement('canvas');
    const expCtx = exportCanvas.getContext('2d');

    const legendHeight = 120;
    exportCanvas.width = canvas.width;
    exportCanvas.height = canvas.height + legendHeight;

    // Draw field
    expCtx.drawImage(canvas, 0, 0);

    // Draw Legend panel
    expCtx.fillStyle = "#1e1e24";
    expCtx.fillRect(0, canvas.height, exportCanvas.width, legendHeight);

    expCtx.fillStyle = "#a5d6a7";
    expCtx.font = "bold 13px -apple-system, BlinkMacSystemFont, sans-serif";
    expCtx.fillText("TEAM SHEET & FIELDING ROSTER", 25, canvas.height + 25);

    // 2 rows of player cards
    const startX = 25;
    const startY = canvas.height + 45;
    const colW = 125;
    const rowH = 30;

    roster.forEach((p, i) => {
      const col = i % 6;
      const row = Math.floor(i / 6);
      const px = startX + (col * colW);
      const py = startY + (row * rowH);

      // Swatch
      expCtx.beginPath();
      expCtx.arc(px + 6, py + 8, 6, 0, Math.PI * 2);
      expCtx.fillStyle = p.color;
      expCtx.fill();
      expCtx.strokeStyle = "#ffffff";
      expCtx.lineWidth = 1;
      expCtx.stroke();

      // Name
      expCtx.fillStyle = "#ffffff";
      expCtx.font = "11px -apple-system, sans-serif";
      expCtx.textAlign = "left";
      expCtx.fillText(`${p.id}. ${p.name}`, px + 18, py + 12);
    });

    const link = document.createElement('a');
    link.download = (document.getElementById('diagTitle').value || 'cricket-field') + '.png';
    link.href = exportCanvas.toDataURL('image/png');
    link.click();
  }

  // --- LOCALSTORAGE CUSTOM SCENARIO MANAGEMENT ---
  function getSavedScenarios() {
    try {
      return JSON.parse(localStorage.getItem('cricket_field_scenarios') || '{}');
    } catch (e) {
      return {};
    }
  }

  function refreshScenarioDropdown() {
    const scenarios = getSavedScenarios();
    const sel = document.getElementById('scenarioSelect');
    sel.innerHTML = '<option value="">-- Load Saved Scenario --</option>';
    Object.keys(scenarios).forEach(name => {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      sel.appendChild(opt);
    });
  }

  function saveCurrentScenario() {
    const currentTitle = document.getElementById('diagTitle').value.trim();
    const name = prompt("Enter a scenario name to save (e.g. 'Powerplay RHB', 'Spin Trap'):", currentTitle);
    if (!name) return;

    const scenarios = getSavedScenarios();
    scenarios[name] = {
      title: document.getElementById('diagTitle').value,
      batterHand: document.getElementById('batterHand').value,
      strikerEnd: document.getElementById('strikerEnd').value,
      roster: roster,
      elements: elements
    };

    localStorage.setItem('cricket_field_scenarios', JSON.stringify(scenarios));
    refreshScenarioDropdown();
    document.getElementById('scenarioSelect').value = name;
    alert(`Scenario "${name}" saved!`);
  }

  function loadScenario() {
    const name = document.getElementById('scenarioSelect').value;
    if (!name) return;

    const scenarios = getSavedScenarios();
    const data = scenarios[name];
    if (data) {
      document.getElementById('diagTitle').value = data.title || name;
      document.getElementById('batterHand').value = data.batterHand || 'RHB';
      document.getElementById('strikerEnd').value = data.strikerEnd || 'top';
      if (data.roster) roster = data.roster;
      elements = JSON.parse(JSON.stringify(data.elements || []));
      arrowStart = null;
      renderRoster();
      drawCanvas();
    }
  }

  function deleteCurrentScenario() {
    const name = document.getElementById('scenarioSelect').value;
    if (!name) {
      alert("Please select a scenario to delete.");
      return;
    }
    if (confirm(`Delete saved scenario "${name}"?`)) {
      const scenarios = getSavedScenarios();
      delete scenarios[name];
      localStorage.setItem('cricket_field_scenarios', JSON.stringify(scenarios));
      refreshScenarioDropdown();
      alert(`Deleted "${name}".`);
    }
  }

  // --- FEEDBACK MODAL SCRIPT ---
  function openFeedbackModal() {
    document.getElementById('feedback-modal-overlay').style.display = 'flex';
  }

  function closeFeedbackModal() {
    document.getElementById('feedback-modal-overlay').style.display = 'none';
  }

  const fbForm = document.getElementById('feedbackForm');
  if (fbForm) {
    fbForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = fbForm.querySelector('button[type="submit"]');
      submitBtn.textContent = 'Sending...';
      submitBtn.disabled = true;

      try {
        const res = await fetch(fbForm.action, {
          method: 'POST',
          body: new FormData(fbForm),
          headers: { 'Accept': 'application/json' }
        });
        if (res.ok) {
          alert('Thank you! Your feedback has been sent.');
          fbForm.reset();
          closeFeedbackModal();
        } else {
          alert('Could not submit feedback. Please check your form endpoint.');
        }
      } catch (err) {
        alert('Network error. Unable to send at this moment.');
      } finally {
        submitBtn.textContent = 'Send';
        submitBtn.disabled = false;
      }
    });
  }

  renderRoster();
  refreshScenarioDropdown();
  drawCanvas();
</script>
